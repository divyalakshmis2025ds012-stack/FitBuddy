<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitBuddy - AI Workout Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(rgba(10,10,15,0.75), rgba(10,10,15,0.75)),
                url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1400&q=60');
    background-size: cover;
    background-position: center;
    padding: 24px;
  }
  .card {
    background: rgba(20, 20, 28, 0.92);
    color: #f5f5f5;
    padding: 36px 32px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    width: 100%;
    max-width: 440px;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-weight: 500;
    margin: 14px 0 6px;
    font-size: 14px;
    color: #cfd3da;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #3a3a45;
    background: #1c1c24;
    color: #fff;
    font-size: 14px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #4f8cff;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #3b6fe0;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover { background: #2f5bc4; }
  @media (max-width: 480px) {
    .card { padding: 24px 18px; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>💪 FitBuddy - AI Workout Generator</h1>
    <form action="/generate-workout" method="post">
      <label for="username">Name</label>
      <input type="text" id="username" name="username" required>

      <label for="user_id">User ID</label>
      <input type="number" id="user_id" name="user_id" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" required>

      <label for="weight">Weight (kg)</label>
      <input type="number" step="0.1" id="weight" name="weight" required>

      <label for="goal">Fitness Goal</label>
      <input type="text" id="goal" name="goal" placeholder="e.g., weight loss, muscle gain, flexibility" required>

      <label for="intensity">Workout Intensity</label>
      <select id="intensity" name="intensity" required>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Generate Plan</button>
    </form>
  </div>
</body>
</html>
